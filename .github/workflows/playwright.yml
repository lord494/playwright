name: Run Changed Playwright Tests

on:
  push:
    branches:
      - main

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Docker Hub login
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------------------------------------
      # 3. Build Docker image
      # ---------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/playwright-tests:latest \
            .

      # ---------------------------------------------------------
      # 4. Push Docker image
      # ---------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/playwright-tests:latest

      # ---------------------------------------------------------
      # 5. Detect which test areas should run
      # ---------------------------------------------------------
      - name: Detect changed folders and map to test dirs
        id: detect-tests
        shell: bash
        run: |
          echo "Detecting changed files..."

          CHANGED_FILES=$(git diff \
            --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          TEST_DIRS_SET=()
          RUN_ALL_TESTS=false

          for file in $CHANGED_FILES; do

            # page/trailer/... -> tests/trailer
            if [[ "$file" == page/*/* ]]; then
              feature=$(echo "$file" | cut -d/ -f2)
              test_path="tests/$feature"

              if [ -d "$test_path" ]; then
                TEST_DIRS_SET+=("$test_path")
              fi
            fi

            # tests/trailer/... -> tests/trailer
            if [[ "$file" == tests/*/* ]]; then
              feature=$(echo "$file" | cut -d/ -f2)
              test_path="tests/$feature"

              if [ -d "$test_path" ]; then
                TEST_DIRS_SET+=("$test_path")
              fi
            fi

            # Shared files can affect many/all tests.
            if [[ "$file" == tests/fixtures/* ]] ||
               [[ "$file" == helpers/* ]] ||
               [[ "$file" == scripts/* ]] ||
               [[ "$file" == "playwright.config.ts" ]] ||
               [[ "$file" == "globalSetup.ts" ]] ||
               [[ "$file" == "package.json" ]] ||
               [[ "$file" == "package-lock.json" ]] ||
               [[ "$file" == "Dockerfile" ]] ||
               [[ "$file" == ".github/workflows/playwright.yml" ]]; then
              RUN_ALL_TESTS=true
            fi
          done

          if [ "$RUN_ALL_TESTS" = true ]; then
            TEST_DIRS="tests"
          else
            TEST_DIRS=$(printf "%s\n" "${TEST_DIRS_SET[@]}" |
              sort -u |
              tr '\n' ' ' |
              xargs)
          fi

          echo "TEST_DIRS=$TEST_DIRS" >> "$GITHUB_ENV"
          echo "Selected test directories: $TEST_DIRS"

      # ---------------------------------------------------------
      # 6. Run Playwright inside Docker.
      #
      # Important:
      # - reporters come from playwright.config.ts
      # - Playwright failure does not stop this step immediately
      # - failure-context and fix-context are generated in container
      # - real Playwright exit code is saved for the final step
      # ---------------------------------------------------------
      - name: Run matched Playwright tests in Docker
        id: playwright-tests
        if: env.TEST_DIRS != ''
        shell: bash
        run: |
          echo "Running tests for: $TEST_DIRS"

          mkdir -p playwright-report
          mkdir -p test-results

          set +e

          docker run --rm \
            -e CI=true \
            -e PLAYWRIGHT_HTML_OPEN=never \
            -e TEST_DIRS="$TEST_DIRS" \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            "${{ secrets.DOCKER_USERNAME }}/playwright-tests:latest" \
            sh -lc '
              set +e

              echo "Running Playwright tests: $TEST_DIRS"

              npx playwright test $TEST_DIRS
              TEST_EXIT_CODE=$?

              echo "Playwright exit code inside container: $TEST_EXIT_CODE"

              if [ -f test-results/results.json ]; then
                echo "Building structured failure context..."

                npm run build:failure-context
                CONTEXT_EXIT_CODE=$?

                if [ "$CONTEXT_EXIT_CODE" != "0" ]; then
                  echo "Failure-context generation failed."
                fi

                if [ "$TEST_EXIT_CODE" != "0" ] &&
                   [ -f test-results/failure-context.json ]; then

                  echo "Building fix suggestion context..."

                  npm run build:fix-context
                  FIX_CONTEXT_EXIT_CODE=$?

                  if [ "$FIX_CONTEXT_EXIT_CODE" != "0" ]; then
                    echo "Fix-context generation failed."
                  fi
                fi
              else
                echo "test-results/results.json was not generated."
              fi

              exit "$TEST_EXIT_CODE"
            ' 2>&1 | tee playwright-output.log

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "$TEST_EXIT_CODE" > playwright-exit-code.txt

          echo "Playwright exit code: $TEST_EXIT_CODE"

          echo "Generated test-results files:"
          find test-results -maxdepth 5 -type f -print || true

          echo "Generated Playwright report files:"
          find playwright-report -maxdepth 3 -type f -print || true

          # Keep workflow alive so analysis, suggestion and artifacts can run.
          exit 0

      # ---------------------------------------------------------
      # 7. No matching tests
      # ---------------------------------------------------------
      - name: Record skipped test execution
        if: env.TEST_DIRS == ''
        shell: bash
        run: |
          echo "No matching test directories were found."
          echo "0" > playwright-exit-code.txt

      # ---------------------------------------------------------
      # 8. Claude failure analysis
      # ---------------------------------------------------------
      - name: Ask Claude to analyze failed Playwright tests
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-6
        shell: bash
        run: |
          set +e

          echo "Claude analysis step started."

          if [ ! -f playwright-exit-code.txt ]; then
            echo "playwright-exit-code.txt does not exist."
            exit 0
          fi

          TEST_EXIT_CODE=$(cat playwright-exit-code.txt)
          echo "Detected Playwright exit code: $TEST_EXIT_CODE"

          if [ "$TEST_EXIT_CODE" = "0" ]; then
            echo "Tests passed. Claude analysis is not required."
            exit 0
          fi

          echo "# Playwright CI Failure Analysis" > claude-analysis.md

          if [ ! -f test-results/failure-context.json ]; then
            echo "" >> claude-analysis.md
            echo "failure-context.json was not generated." >> claude-analysis.md
            exit 0
          fi

          if [ ! -f playwright-output.log ]; then
            touch playwright-output.log
          fi

          jq -n \
            --rawfile failureContext test-results/failure-context.json \
            --rawfile terminalOutput playwright-output.log \
            --arg model "$CLAUDE_MODEL" \
            '{
              model: $model,
              max_tokens: 4000,
              messages: [
                {
                  role: "user",
                  content: (
                    "Analyze this failed Playwright CI run.\n\n" +

                    "Your analysis must be based only on the supplied evidence. " +
                    "Do not classify a failure as an application bug only because " +
                    "a test timed out, a locator was missing, or a page was closed.\n\n" +

                    "The structured failure context already contains browser and " +
                    "network diagnostics under browserDiagnostics for each attempt.\n\n" +

                    "Group tests that appear to share the same root cause.\n\n" +

                    "Use exactly one classification for each failure group:\n" +
                    "- Confirmed application bug\n" +
                    "- Likely application bug\n" +
                    "- Confirmed automation issue\n" +
                    "- Likely automation issue\n" +
                    "- Test-data issue\n" +
                    "- Environment/CI issue\n" +
                    "- Dependency/service issue\n" +
                    "- Inconclusive\n\n" +

                    "Use exactly one confidence level:\n" +
                    "- High\n" +
                    "- Medium\n" +
                    "- Low\n\n" +

                    "For every failure group include:\n" +
                    "1. Affected tests\n" +
                    "2. Immediate failure\n" +
                    "3. Confirmed evidence\n" +
                    "4. Most likely root cause\n" +
                    "5. Classification\n" +
                    "6. Confidence\n" +
                    "7. Severity\n" +
                    "8. Recommended next actions\n" +
                    "9. Changes that should not be made\n" +
                    "10. Relevant artifacts\n\n" +

                    "Clearly separate confirmed facts from hypotheses.\n" +
                    "Do not recommend fixed waits or arbitrary timeout increases.\n\n" +

                    "At the very end of the analysis include exactly this section:\n\n" +
                    "## Fix Suggestion Status\n\n" +
                    "Status: Generate suggestion\n" +
                    "or\n" +
                    "Status: Do not generate suggestion\n\n" +
                    "Reason: <brief evidence-based explanation>\n\n" +

                    "Use \"Generate suggestion\" only when:\n" +
                    "- the failure is a confirmed or highly likely automation issue;\n" +
                    "- confidence is High;\n" +
                    "- the available evidence supports a concrete automation fix.\n\n" +

                    "Use \"Do not generate suggestion\" for:\n" +
                    "- application bugs;\n" +
                    "- test-data issues;\n" +
                    "- environment or CI issues;\n" +
                    "- dependency failures;\n" +
                    "- inconclusive failures;\n" +
                    "- low or medium confidence.\n\n" +

                    "Before the Fix Suggestion Status section, end the main report with:\n" +
                    "- Overall run summary\n" +
                    "- Release risk\n" +
                    "- Suggested owner for each failure group\n" +
                    "- Prioritized next actions\n\n" +

                    "STRUCTURED FAILURE CONTEXT:\n" +
                    $failureContext +

                    "\n\nPLAYWRIGHT TERMINAL OUTPUT:\n" +
                    $terminalOutput
                  )
                }
              ]
            }' > claude-request.json

          if [ ! -s claude-request.json ]; then
            echo "" >> claude-analysis.md
            echo "Claude request JSON could not be created." >> claude-analysis.md
            exit 0
          fi

          echo "Sending request to Claude model: $CLAUDE_MODEL"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output claude-raw-response.json \
            --write-out "%{http_code}" \
            https://api.anthropic.com/v1/messages \
            --header "x-api-key: $ANTHROPIC_API_KEY" \
            --header "anthropic-version: 2023-06-01" \
            --header "content-type: application/json" \
            --data @claude-request.json)

          echo "Claude API status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "" >> claude-analysis.md
            echo "Claude API returned HTTP status $HTTP_CODE." >> claude-analysis.md
            echo "" >> claude-analysis.md
            echo '```json' >> claude-analysis.md
            cat claude-raw-response.json >> claude-analysis.md 2>/dev/null || true
            echo '```' >> claude-analysis.md
            exit 0
          fi

          jq -r \
            '.content[0].text // .error.message // "Claude returned no readable analysis."' \
            claude-raw-response.json \
            >> claude-analysis.md

          echo "Claude analysis created successfully."

      # ---------------------------------------------------------
      # 9. Claude fix suggestion
      #
      # Runs only when:
      # - analysis exists
      # - fix-context exists
      # - analysis explicitly says Generate suggestion
      # ---------------------------------------------------------
      - name: Ask Claude for Playwright fix suggestion
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-6
        shell: bash
        run: |
          set +e

          echo "Claude fix suggestion step started."

          if [ ! -f claude-analysis.md ]; then
            echo "Claude analysis does not exist."
            exit 0
          fi

          if [ ! -f test-results/fix-context.json ]; then
            echo "fix-context.json does not exist."
            exit 0
          fi

          if ! grep -Fq "Status: Generate suggestion" claude-analysis.md; then
            echo "Claude analysis did not approve a fix suggestion."
            exit 0
          fi

          jq -n \
            --rawfile analysis claude-analysis.md \
            --rawfile fixContext test-results/fix-context.json \
            --arg model "$CLAUDE_MODEL" \
            '{
              model: $model,
              max_tokens: 2500,
              messages: [
                {
                  role: "user",
                  content: (
                    "Create a Playwright automation fix suggestion.\n\n" +

                    "Do not modify repository files.\n" +
                    "Do not create a commit or pull request.\n\n" +

                    "Only suggest a change that addresses the identified " +
                    "automation root cause.\n\n" +

                    "Never suggest:\n" +
                    "- waitForTimeout\n" +
                    "- arbitrary timeout increases\n" +
                    "- additional retries\n" +
                    "- removing or weakening assertions\n" +
                    "- ignoring failures\n\n" +

                    "Return Markdown with exactly these sections:\n\n" +

                    "# Playwright Fix Suggestion\n\n" +

                    "## Target\n" +
                    "- Test\n" +
                    "- File\n" +
                    "- Failure type\n\n" +

                    "## Why This Is an Automation Issue\n\n" +

                    "## Suggested Change\n" +
                    "Include the smallest relevant TypeScript code snippet.\n\n" +

                    "## Expected Result\n\n" +

                    "## Manual Verification\n" +
                    "Explain how QA should verify the suggestion.\n\n" +

                    "Do not claim the fix is confirmed because it has not " +
                    "been applied or executed.\n\n" +

                    "CLAUDE FAILURE ANALYSIS:\n" +
                    $analysis +

                    "\n\nFIX CONTEXT AND SOURCE CODE:\n" +
                    $fixContext
                  )
                }
              ]
            }' > claude-suggestion-request.json

          if [ ! -s claude-suggestion-request.json ]; then
            echo "Claude suggestion request JSON could not be created."
            exit 0
          fi

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output claude-suggestion-response.json \
            --write-out "%{http_code}" \
            https://api.anthropic.com/v1/messages \
            --header "x-api-key: $ANTHROPIC_API_KEY" \
            --header "anthropic-version: 2023-06-01" \
            --header "content-type: application/json" \
            --data @claude-suggestion-request.json)

          echo "Claude suggestion API status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Claude suggestion request failed."
            exit 0
          fi

          jq -r \
            '.content[0].text // empty' \
            claude-suggestion-response.json \
            > claude-suggestion.md

          if [ -s claude-suggestion.md ]; then
            echo "Claude suggestion created successfully."
          else
            rm -f claude-suggestion.md
            echo "Claude returned no suggestion."
          fi

      # ---------------------------------------------------------
      # 10. GitHub job summary
      # ---------------------------------------------------------
      - name: Add Claude analysis and suggestion to job summary
        if: always()
        shell: bash
        run: |
          if [ -f claude-analysis.md ]; then
            cat claude-analysis.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Claude analysis was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f claude-suggestion.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat claude-suggestion.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------
      # 11. Upload Claude analysis/suggestion files
      # ---------------------------------------------------------
      - name: Upload Claude analysis and suggestion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-analysis-${{ github.run_id }}
          path: |
            claude-analysis.md
            claude-raw-response.json
            claude-request.json
            claude-suggestion.md
            claude-suggestion-request.json
            claude-suggestion-response.json
            playwright-output.log
            playwright-exit-code.txt
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------
      # 12. Upload Playwright HTML report
      # ---------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------
      # 13. Upload raw/structured Playwright results
      #
      # Includes:
      # - results.json
      # - failure-context.json
      # - fix-context.json (when tests fail)
      # - browser-diagnostics.json
      # - screenshots
      # - traces
      # - videos
      # ---------------------------------------------------------
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------
      # 14. Fail workflow only after all analysis/artifacts finish
      # ---------------------------------------------------------
      - name: Fail workflow if Playwright tests failed
        if: always()
        shell: bash
        run: |
          if [ ! -f playwright-exit-code.txt ]; then
            echo "Playwright exit-code file was not generated."
            exit 1
          fi

          TEST_EXIT_CODE=$(cat playwright-exit-code.txt)

          if [ "$TEST_EXIT_CODE" != "0" ]; then
            echo "Playwright tests failed with exit code $TEST_EXIT_CODE."
            exit 1
          fi

          echo "No failed Playwright tests detected."
